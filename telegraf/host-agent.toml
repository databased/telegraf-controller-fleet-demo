# host-agent.toml (PROPOSED, portable). Paste into Telegraf Controller.
# Telegraf expands ${VAR} from the agent container's environment, so the
# controller-stored config carries no account-specific literals.
# Required env: INFLUX_URL INFLUX_ORG INFLUX_BUCKET INFLUX_TOKEN AGENT_HOSTNAME
#               TELEGRAF_CONTROLLER_TOKEN  (optional: WATCH_CONTAINERS)
# UNTESTED: verify the heartbeat block and "&{agent_id}" against the Controller docs.

[global_tags]
  host = "${AGENT_HOSTNAME}"

[agent]
  hostname = "${AGENT_HOSTNAME}"
  interval = "30s"
  round_interval = true
  metric_buffer_limit = 5000
  flush_interval = "30s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.processes]]

[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

# Must-fix #3: "sda" matched nothing on vda/nvme hosts. Telegraf globs cover the
# common whole-disk names (not partitions): SCSI/SATA, virtio, Xen, NVMe, SD/eMMC.
[[inputs.diskio]]
  devices = ["sd?", "vd?", "xvd?", "nvme?n?", "mmcblk?"]

[[inputs.internal]]
  collect_memstats = false

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["${WATCH_CONTAINERS}"]
  gather_services = false

# Must-fix #5: invoke through /bin/sh so the script needs no exec bit.
[[inputs.exec]]
  commands = ["/bin/sh /etc/telegraf/psi-lineprotocol.sh"]
  data_format = "influx"
  timeout = "5s"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[outputs.heartbeat]]
  url = "http://127.0.0.1:8000/agents/heartbeat"
  instance_id = "&{agent_id}"
  token = "${TELEGRAF_CONTROLLER_TOKEN}"
  interval = "1m"
  include = ["hostname", "statistics", "configs", "logs", "status"]

  [outputs.heartbeat.logs]
    level = "error"

  [outputs.heartbeat.status]
    default = "ok"
